---
# Live probe — the end-to-end proof that the rule behaves per mode on
# THIS kernel. python3 connections over loopback (loopback traffic
# traverses the input hook):
#   enforce: SYN with four NOP IP options (IHL 6) must TIME OUT (dropped);
#            plain SYN must still CONNECT (no collateral damage)
#   observe:  options SYN must CONNECT (rule not dropping) AND the rule's
#            matched counter must increment (rule counting — the evidence
#            pipeline proven end-to-end); plain SYN must connect
# A kernel that strips or rejects options on its own would make the
# enforce probe pass vacuously — which is why the wrapper playbook also
# runs the baseline probe BEFORE the role (see baseline.yml) and fails if
# the options probe does not connect there.
- name: Run the drop probe script
  ansible.builtin.script:
    cmd: probe.py --mode {{ cve_2026_98432_resolved_mode }}
    executable: python3
  register: cve_2026_98432_probe
  changed_when: false
  # probe.py exits 1 on PASS in both modes; 0 = mitigation not
  # dropping/counting; 2 = plain-SYN collateral damage.
  failed_when: cve_2026_98432_probe.rc == 0 or cve_2026_98432_probe.rc >= 2
  ignore_errors: "{{ ansible_check_mode }}"

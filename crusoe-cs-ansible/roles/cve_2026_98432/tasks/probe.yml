---
# Live probe — the end-to-end proof that the rule behaves per mode on
# THIS kernel. Runs the SHARED probe engine (roles/nft_rules/
# files/nft-probe.py) with this role's identity: the raw-socket
# options-SYN trigger (IP_HDRINCL — no socket inet_opt on the client
# path, the unattestable client path on unpatched kernels) plus the
# plain-SYN control.
#   enforce: the options SYN must get NO SYN-ACK (dropped at priority
#            raw, before the listener); a plain SYN must still CONNECT.
#   observe: the options SYN must be ACKed AND the rule's match
#            counter must increment; a plain SYN must connect.
# A kernel that strips or rejects options on its own would make the
# enforce probe pass vacuously — which is why the wrapper playbook
# also runs the baseline probe BEFORE the role (see baseline.yml) and
# fails if the options SYN does not connect there.
- name: Run the drop probe script
  ansible.builtin.script:
    cmd: >-
      {{ role_path }}/../nft_rules/files/nft-probe.py
      --mode {{ cve_2026_98432_resolved_mode }}
      --table {{ cve_2026_98432_table }}
    executable: python3
  register: cve_2026_98432_probe
  changed_when: false
  # probe.py exits 1 on PASS in both modes; 0 = mitigation not
  # dropping/counting; 2 = plain-SYN collateral damage.
  failed_when: cve_2026_98432_probe.rc == 0 or cve_2026_98432_probe.rc >= 2
  ignore_errors: "{{ ansible_check_mode }}"

---
# node_exporter textfile metrics. The metrics script no-ops on hosts
# without the textfile directory (the np VMs have no node_exporter) —
# the units are still installed so the moment node_exporter appears,
# the timer starts publishing without another Ansible run. On k8s
# nodes the chart-owned hostPath below takes the script's output
# instead (the metrics sidecar serves it on :19698).
- name: Create the chart metrics hostPath
  ansible.builtin.file:
    path: "{{ cve_2026_98432_metrics_host_dir if not (cve_2026_98432_pod_native | bool) else cve_2026_98432_metrics_host_dir_pod }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the metrics script directory
  ansible.builtin.file:
    path: "{{ cve_2026_98432_metrics_script | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the metrics script
  ansible.builtin.copy:
    src: cve-2026-98432-metrics.sh
    dest: "{{ cve_2026_98432_metrics_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Create the metrics units directory
  ansible.builtin.file:
    path: "{{ '/host' if cve_2026_98432_pod_native | bool else '' }}/etc/systemd/system"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: cve_2026_98432_host_etc_writable.stdout | default('no') == 'yes' and cve_2026_98432_systemd_usable.rc | default(1) == 0

- name: Install the metrics units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ '/host' if cve_2026_98432_pod_native | bool else '' }}/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - cve-2026-98432-metrics.service
    - cve-2026-98432-metrics.timer
  register: cve_2026_98432_metrics_units
  # The systemd timer is the HOST's consumer (bare VMs). Pod-native
  # targets without a writable host /etc have no systemd to run it —
  # the chart's scheduled re-run re-executes the script instead.
  when: cve_2026_98432_host_etc_writable.stdout | default('no') == 'yes' and cve_2026_98432_systemd_usable.rc | default(1) == 0

- name: Publish the metrics every minute
  ansible.builtin.systemd:
    name: "{{ cve_2026_98432_metrics_timer }}"
    enabled: true
    state: started
    daemon_reload: "{{ cve_2026_98432_metrics_units is changed }}"
  ignore_errors: "{{ ansible_check_mode }}"
  when: cve_2026_98432_host_etc_writable.stdout | default('no') == 'yes' and cve_2026_98432_systemd_usable.rc | default(1) == 0

- name: Publish the metrics once now (no systemd timer available)
  # Pod-native targets without a writable host /etc: the chart's
  # scheduled re-run re-executes this script; run it once now so the
  # sidecar has fresh metrics immediately after this run. The script's
  # destination must be the HOST-side dir (the sidecar mounts the
  # hostPath, not this container's /var/lib).
  ansible.builtin.command: >-
    sh -c 'CVE_METRICS_CHART_DIR={{ cve_2026_98432_metrics_host_dir_pod }}
    sh {{ cve_2026_98432_metrics_script }}'
  changed_when: false
  when: cve_2026_98432_host_etc_writable.stdout | default('no') != 'yes' or cve_2026_98432_systemd_usable.rc | default(1) != 0

# ============================================================
# Crusoe CS Ansible — CI/CD Pipeline
# ============================================================
# Validates all YAML and Ansible content on every MR and push
# to main. Extend with 'test' and 'deploy' stages as the repo
# grows.
#
# NOTE: stages are declared in the monorepo root .gitlab-ci.yml
# (GitLab's include merge makes the last `stages:` win, so this
# file must not declare its own).
# ============================================================

# ------------------------------------------------------------------
# Reusable rule sets
# ------------------------------------------------------------------
# Run on merge requests and direct pushes to main.
.rules-mr-and-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ------------------------------------------------------------------
# yaml-lint
# ------------------------------------------------------------------
# Lints every YAML file in the repository for syntax and formatting
# issues. Runs before ansible-lint so formatting problems are caught
# first. Uses pipelinecomponents/yamllint — a minimal image that
# ships yamllint with no extra setup required.
yaml-lint:
  stage: validate
  image: pipelinecomponents/yamllint:latest
  extends: .rules-mr-and-main
  script:
    # Lint all YAML files. cd into the component: its .yamllint
    # (line-length 160, charts/ ignored) lives there — running from
    # the monorepo root would pick up yamllint's defaults (80 chars,
    # error level) and flag everything.
    - cd crusoe-cs-ansible && yamllint .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ------------------------------------------------------------------
# ansible-lint
# ------------------------------------------------------------------
# Enforces Ansible best practices across all playbooks and roles.
# Uses pipelinecomponents/ansible-lint — ships ansible-lint and its
# Ansible dependencies pre-installed.
# A .ansible-lint config file at the repo root controls which rules
# are enabled/skipped without touching this job definition.
ansible-lint:
  stage: validate
  image: python:3.14-slim
  extends: .rules-mr-and-main
  script:
    # Install the repo's OWN pinned toolchain (Pipfile.lock): the
    # floating pipelinecomponents image carries an ansible-lint/ansible-
    # core combo whose syntax-check errors on the playbooks'
    # mandatory()-in-hosts pattern (a false positive the repo's pinned
    # versions tolerate). cd into the component: its .ansible-lint and
    # ansible.cfg (roles_path etc.) live there.
    - pip install --quiet "ansible-lint==26.4.0" "ansible-core==2.20.6"
    # ANSIBLE_CONFIG bypasses ansible's world-writable-dir check (the
    # checkout dir is 0777 in CI, so ansible.cfg would be ignored and
    # roles_path lost → the syntax-check can't resolve roles).
    - cd crusoe-cs-ansible && ANSIBLE_CONFIG=$PWD/ansible.cfg ansible-lint .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -- Container image: the derived ansible image (the repo's ONE image —
#    controller AND DaemonSet payload; roles + wrappers + inventory +
#    callback plugins + the generic mitigate.py entrypoint baked at
#    /opt/ansible).
#
#    ⚠️ PIN BY DIGEST — never a floating tag: a fleet install must run
#    exactly the bytes that were reviewed.
#
#    Resolution order (first match wins):
#      1. --set image.full=<ref>          (explicit escape hatch)
#      2. the values below (all three required)
#    The assembled ref MUST be digest-pinned (@sha256:...); the chart
#    fails loudly if nothing resolves.
#
#    The default digest is the cefb707 build (the customer-feedback
#    release: the raw-socket probe (no inet_opt on the client path),
#    counter preservation via generation signatures, the reconciler's
#    10s host republish, priorityClassName/resources/tolerations,
#    metricsBind, the mode-event mid-run flip fix, the mktemp 0644
#    publish) — published to GHCR by the main pipeline. Re-pin on
#    each release: the ansible-image:build job output prints the
#    digest to pin here.
image:
  # Explicit full image reference (overrides registry/repository/digest).
  full: ""
  registry: ghcr.io/crusoecloud
  repository: crusoe-cs/ansible
  digest: sha256:2bbe2bb8ec55988d2f0177134d2fe4b671789cda8a4973f16561511049b9a743
  # IfNotPresent is the REGISTRY-path default (the default image IS
  # a registry ref — a Never default with a registry image is the
  # ErrImageNeverPull/ImagePullBackOff trap, found live on both
  # clusters). SIDELOAD workflows (e2e, air-gapped) set Never: the
  # image is loaded into the node's containerd and a pull must fail
  # rather than reach a registry.
  pullPolicy: IfNotPresent

# -- Mitigations to run on every node. Each entry:
#      name:     short identifier (logs, journal, failure reporting)
#      enabled:  false skips the entry entirely
#      playbook: wrapper playbook baked at /opt/ansible in the image
#      vars:     flat map passed to the playbook as -e key=value
#      interval: 0 (default) = ONCE per pod start — re-runs happen when
#                the pod restarts (node reboot, pod deletion, chart
#                upgrade). > 0 = SCHEDULED: re-run every interval
#                seconds for the pod's lifetime, for mitigations that
#                must hold continuously or can be undone mid-life (a
#                package upgrade reinstalls a vulnerable file, another
#                tool flushes the nft ruleset). Scheduled roles MUST be
#                idempotent — a compliant host's re-run is zero-change.
#      sidecar:  optional — a second container this mitigation needs
#                (image from the same digest-pinned ref; command from
#                the image). Fields: command, interval (env
#                POD_NETNS_INTERVAL), comment. The mitigation owns its
#                sidecar; disabling the mitigation removes it.
#
#    The pod runs EVERY enabled mitigation (one failure does not block
#    the others), parks when all once-only mitigations succeed and
#    nothing is scheduled, and CrashLoops naming the failures otherwise.
mitigations:
  - name: cve-2026-98432
    enabled: true
    # Pod-native delivery (default): the image's own nft via netlink
    # against the shared host netns — no chroot, no host userspace.
    playbook: wrapper-cve-2026-98432-pod.yml
    # -- Mode: label-driven (the role's default). The node's
    #    cve-2026-98432.remediator.crusoe.ai/mode label IS the rollout
    #    state — absent = observe (the sane default; nothing drops
    #    without an explicit operator action), mode=enforce = enforce
    #    (the deliberate action), mode=observe = the sanctioned R1
    #    downgrade. After Stage 4 completes, PIN the mode here (the
    #    steady-state release sets cve_2026_98432_mode: enforce) so
    #    NEW nodes that join without a label load enforce from the
    #    release — no per-node labeling in steady state.
    #    NB: TWO REGIMES, NEVER MIXED. The label resolution runs only
    #    in auto mode — a PINNED mode IGNORES the label entirely, so
    #    an R1 label flip (mode=observe) does NOTHING on a pinned
    #    release (the next run re-imposes the pin). Label-driven =
    #    rollout era (waves, canary, seconds-fast label rollback);
    #    pinned = steady state (new nodes self-protect; rollback is a
    #    helm upgrade — rare and deliberate). Pick one per release.
    #    To pin for other reasons instead (air-gapped clusters, the
    #    SSH path, a freeze hold), set the role's mode var in `vars`
    #    below — and NEVER via `--set mitigations[0].vars...`: Helm
    #    REPLACES list elements wholesale, dropping name/playbook/enabled and
    #    silently disabling the mitigation.
    # Metrics: the role's metrics engine (nft-metrics.sh) writes cve_2026_98432.prom into
    # the chart hostPath; the metrics-server sidecar serves it on
    # :19698 (see metricsPort / metricsBackend above).
    metrics: true
    # Scheduled: the nft table can be flushed out-of-band (another
    # tool's `nft flush ruleset`), and the role's table check
    # self-heals it — verified: delete → re-run → restored, changed=1.
    # The re-run CHECKS every interval but only RELOADS when the
    # state diverged (table missing, ruleset changed, mode flip) —
    # a converged table is skipped, preserving the rule's counters
    # (a table replace frees them; the host evidence series would
    # otherwise read ~0 forever).
    interval: 3600
    vars:
      cve_2026_98432_run_probe: "true"
      cve_2026_98432_metrics: "true"
      cve_2026_98432_fail_on_unsupported_family: "true"
      # The metrics timer's cadence (seconds; role default 60). The
      # timer is the HOST-side consumer and only affects SSH/bare-VM
      # delivery: the pod-native chart image (alpine) ships no
      # systemctl, so the timer never installs in chart deployments —
      # the reconciler's 10s republish owns host-series freshness
      # there and this var is inert. 10 = burst resolution on
      # timer-capable (bare-VM) nodes.
      cve_2026_98432_metrics_interval_seconds: "60"
    # Pod-netns reconciler sidecar: installs the drop rule inside every
    # pod network namespace — event-driven (inotify on /run/netns;
    # Cilium mounts every pod netns there) with an interval fallback
    # sweep. Cilium's veth/tc BPF delivers pod-bound traffic into the
    # pod netns WITHOUT traversing the host's nft hooks (verified
    # empirically on Cilium v1.19.1), so the host rule alone leaves pod
    # sockets exposed. Harmless on bridge-mode CNIs; no-op on
    # containerless hosts.
    #
    # The /host mount carries mountPropagation: HostToContainer
    # (daemonset.yaml): the reconciler enters pod netns via the
    # /run/netns/<id> bind mounts the CNI creates AFTER this pod
    # started — without propagation those mounts are invisible inside
    # the container and nsenter fails "Invalid argument" (found live:
    # fresh pods ran ~10s uncovered, the /proc-scan
    # interval, and the skip was silent). The reconciler also retries
    # a first-sight EINVAL (the CNI creates the file before mounting
    # the netns onto it) and diagnoses every skip against the two
    # mount-namespace views it can read (hostPID): a mount the host
    # has but this container lacks WARNs naming the propagation fix;
    # a stale leftover (pod gone) logs benign INFO.
    sidecar:
      command: /usr/local/sbin/cve-2026-98432-netns-reconcile.py
      # Sweep interval (seconds). inotify covers netns that Cilium
      # mounts in /run/netns instantly, but NOT every pod netns gets a
      # mount (verified live) — the interval sweep is the primary
      # catcher for those, so keep it short: it is the worst-case
      # exposure window for a new pod. The sweep is cheap (one stat
      # per /proc entry plus an nft list per uncovered netns).
      interval: 10
  - name: emudhra-ca
    enabled: false
    playbook: wrapper.yml
    # Scheduled: a ca-certificates package upgrade can reinstall a
    # distrusted root; the role's fingerprint detection re-excises it.
    interval: 86400
    vars:
      emudhra_ca_run_connectivity_check: "false"
      emudhra_ca_fail_on_unsupported_family: "true"
      emudhra_ca_extended_stores: "true"

# -- Metrics: any enabled mitigation with metrics: true (default)
#    renders the generic metrics-server sidecar — a tiny HTTP server
#    (serve-metrics.py, baked into the image) that serves every *.prom
#    in the chart metricsDir hostPath on the metricsPort. The pod
#    carries prometheus.io/scrape annotations, so the cluster's
#    existing scrape path picks it up with zero config changes
#    (vmagent's kubernetes-pods job on Crusoe; managed collection via
#    the PodMonitoring CR on GKE — see metricsBackend).
metricsPort: 19698

# -- HostPath directory the metrics generators write into and the
#    sidecar serves. Must match the role's
#    cve_2026_98432_metrics_host_dir (the role creates it; the
#    metrics engine and the reconciler write here via their env
#    defaults).
metricsDir: /var/lib/crusoe-mitigator

# -- Metrics egress adapter: "vmagent" (default — pod annotations,
#    Crusoe k8s) or "gmp" (renders a PodMonitoring CR for Google
#    Managed Service for Prometheus managed collection, scraping the
#    same :19698 exposition).
metricsBackend: vmagent

# -- Liveness probes (default on). The reconciler's probe enforces the
#    heartbeat contract (alive-file age < 5x sweep interval); the
#    metrics-server probes GET /metrics (the exact path vmagent/GMP
#    scrapes — a passing probe proves the evidence path); the
#    mitigator's probe checks the entrypoint process (the playbook's
#    own success/failure is the CrashLoop's job).
probes:
  enabled: true
  reconcilerAliveMaxAge: 50   # seconds; 5x the 10s sweep
  metricsTimeoutSeconds: 3

# -- Pod termination grace period (seconds). On deletion kubelet sends
#    SIGTERM; the mitigator entrypoint drains (the in-flight playbook
#    finishes, no new run starts) and exits 0. Keep this comfortably
#    above a playbook run's duration; after it kubelet SIGKILLs and
#    the idempotent re-run on restart repairs any half-finished state.
terminationGracePeriodSeconds: 10

# -- Pod priority class. EMPTY by default (the chart stays minimal);
# set on fleets where the mitigator must not be the first thing
# evicted under memory pressure (BestEffort pods are evicted FIRST —
# common on GPU nodes during big jobs — and while the pod is gone
# its netns reconciler isn't running, so pods created in that
# window get no netns rule until it's back). The Cilium pattern:
#   priorityClassName: system-node-critical
priorityClassName: ""

# -- Per-container resources. EMPTY by default (no requests = the
#    pod stays BestEffort; a default request would change scheduling
#    on every existing fleet — the operator opts in). Keys map to
#    the pod's containers: mitigator (the main container), reconciler
#    (the pod-netns sidecar), metricsServer (the :19698 sidecar).
#    Requests move the pod out of BestEffort (first-evicted class);
#    limits cap it.
resources: {}
#  mitigator:
#    requests:
#      cpu: 100m
#      memory: 128Mi
#    limits:
#      memory: 512Mi
#  reconciler:
#    requests:
#      cpu: 50m
#      memory: 64Mi
#  metricsServer:
#    requests:
#      cpu: 10m
#      memory: 32Mi

# -- Scheduled mitigations CrashLoop after this many consecutive
#    failures (a transient failure rides the retry backoff above;
#    once-only failures CrashLoop immediately — the CrashLoop backoff
#    is the retry cadence). 0 = crash on the first scheduled failure.
mitigationMaxConsecutiveFailures: 3

# -- Base seconds for the failed-run retry backoff (doubling per
#    consecutive failure, capped at each mitigation's interval):
#    30 → 60 → 120... A failed scheduled run retries at this pace
#    from the failed ATTEMPT — fast enough that drift (a flushed
#    ruleset) heals in ~30s, spaced enough that a transient blip
#    burns at most one consecutive-failure strike. 0 restores the
#    pre-fix immediate-retry behavior.
mitigationFailureRetryBaseSeconds: 30

# -- Write structured events (start, per-mitigation result, recap) to
#    the node's systemd journal via the journald_syslog callback plugin.
#    The Crusoe Watch Agent (Vector) forwards journald entries to the
#    Crusoe Managed Logs console — filter by SYSLOG_IDENTIFIER=
#    crusoe-mitigator there. On hosts without the socket the callback
#    disables itself silently and kubectl logs remains the primary
#    channel.
journaldLogging: true

# Restrict to specific nodes (e.g. the k8s nodepool).
# Leave empty to run on all nodes.
nodeSelector: {}
#  node-role.kubernetes.io/worker: ""

# Taints the mitigator tolerates. EMPTY by default: the chart stays
# minimal and an upgrade changes nothing about where the pod schedules.
#
# ⚠ THE GAP THIS LEAVES: a DaemonSet with no tolerations stays off
# every tainted node — and GPU nodes are usually tainted, so the hosts
# most likely to matter can be uncovered, SILENTLY (the DaemonSet just
# schedules fewer pods; nothing reports the gap). Check your fleet:
#
#   kubectl get nodes -o custom-columns='NAME:.metadata.name,TAINTS:.spec.taints'
#
# To cover tainted nodes, opt in:
#   tolerations:
#   - operator: Exists
#
# (operator: Exists with no key tolerates EVERY taint, including
# control-plane ones — scope it with a key if that is too broad.)
tolerations: []

# The metrics server's bind address. EMPTY means the node's INTERNAL
# address (the downward API's status.hostIP, injected as
# STATUS_HOST_IP).
#
# With hostNetwork: true the pod shares the node's network namespace,
# so 0.0.0.0 would also listen on the node's PUBLIC interface wherever
# the provider firewall allows it — an unauthenticated endpoint
# exposing per-namespace series. vmagent scrapes the pod IP, which
# under hostNetwork IS the internal address, so the default keeps the
# scrape working while removing the public listener.
#
# TWO choices, because this is a DaemonSet-wide setting that must
# resolve PER NODE:
#   ""          the node's own internal IP (default; public closed)
#   "0.0.0.0"   all interfaces (exposes the public interface — firewall
#               it at the provider level; a NetworkPolicy cannot
#               restrict hostNetwork pod traffic)
#
# Anything else fails the render. A literal IP would make every node
# bind the same address and all but one fail with "address not
# available"; 127.0.0.1 would break the scrape (vmagent targets the
# pod IP).
metricsBind: ""

imagePullSecrets: []
